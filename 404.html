<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found • ROSEVERSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Hanken+Grotesk:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(20, 15, 30, 0.9) 0%, #040306 80%);
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      max-width: 600px;
      padding: 4rem 3rem;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(186, 208, 136, 0.3);
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(182,208,136,0.2);
      backdrop-filter: blur(20px);
    }
    .error-code {
      font-family: 'Cinzel Decorative', Georgia, serif;
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #d2eca2 50%, #50652a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: 'Libre Caslon Text', serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #50652a, #394d14);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(80, 101, 42, 0.5);
      transition: all 0.3s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(182, 208, 136, 0.7);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Destination Beyond the Bloom</h1>
    <p class="error-desc">The botanical page you are searching for does not exist or has been relocated within our kinetic atelier.</p>
    <a href="index.html" class="home-btn">
      <i class="fa-solid fa-house"></i> Return to Roseverse Atelier
    </a>
  </div>
</body>
</html>
